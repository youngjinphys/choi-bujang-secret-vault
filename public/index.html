<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 로그인 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0c1522; color: #edf5ff; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    main { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 72px; }
    .eyebrow { color: #8ad8df; font-size: 13px; font-weight: 800; letter-spacing: .1em; }
    h1 { margin: 12px 0 8px; font-size: clamp(32px, 7vw, 48px); line-height: 1.15; }
    p { margin: 0; color: #b8cbe0; line-height: 1.65; }
    .shell { margin-top: 26px; display: grid; gap: 18px; }
    .panel { border: 1px solid #344b63; border-radius: 16px; background: #132235; padding: 20px; }
    .auth-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
    label { display: grid; gap: 7px; color: #bed0e2; font-size: 14px; }
    input, textarea { width: 100%; border: 1px solid #4a627b; border-radius: 10px; background: #0d1a29; color: #f3f8ff; padding: 11px 12px; outline: none; }
    input:focus, textarea:focus { border-color: #77cdd5; box-shadow: 0 0 0 3px #77cdd51f; }
    textarea { min-height: 92px; resize: vertical; }
    .primary, .secondary, .danger { border: 0; border-radius: 10px; padding: 11px 15px; font-weight: 800; }
    .primary { background: #8ad8df; color: #092027; }
    .secondary { background: #263d55; color: #eaf4ff; }
    .danger { background: #562d36; color: #ffdce2; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .status { margin-top: 12px; min-height: 24px; color: #c7d8e9; font-size: 14px; }
    .status.error { color: #ffb7c2; }
    .session { display: flex; gap: 12px; justify-content: space-between; align-items: center; }
    .session strong { display: block; margin-bottom: 4px; }
    .notice { border-color: #7a603a; background: #5a3f2038; color: #ffebc4; }
    .composer { display: grid; grid-template-columns: 1fr 2fr auto; gap: 10px; align-items: end; }
    #notes { display: grid; gap: 12px; }
    .note { border: 1px solid #344b63; border-radius: 14px; background: #101e2f; padding: 16px; }
    .note-grid { display: grid; grid-template-columns: 1fr 2fr auto; gap: 10px; align-items: start; }
    .note-actions { display: grid; gap: 8px; }
    .muted { color: #8fa7bd; font-size: 13px; }
    [hidden] { display: none !important; }
    @media (max-width: 720px) {
      main { width: min(100% - 24px, 920px); padding-top: 28px; }
      .auth-row, .composer, .note-grid { grid-template-columns: 1fr; }
      .session { align-items: flex-start; }
      .note-actions { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 5단계 서버 한곳으로 모으기</div>
    <h1>로그인 자료실</h1>
    <p>로그인과 메모 요청 모두 Vercel 서버 함수를 거치며, 브라우저에는 Supabase API 키를 두지 않습니다.</p>

    <div class="shell">
      <section class="panel" id="signed-out">
        <form id="login-form" class="auth-row">
          <label>이메일
            <input id="email" type="email" autocomplete="email" required>
          </label>
          <label>비밀번호
            <input id="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="primary" type="submit">로그인</button>
        </form>
        <div id="login-status" class="status" aria-live="polite"></div>
      </section>

      <section class="panel" id="signed-in" hidden>
        <div class="session">
          <div>
            <strong id="session-label">로그인됨</strong>
            <span class="muted">서버가 로그인 토큰과 메모 소유자를 다시 검증합니다.</span>
          </div>
          <button id="logout" class="secondary" type="button">로그아웃</button>
        </div>
      </section>

      <section class="panel notice">
        메모 CRUD는 Vercel /api/notes 경로만 사용합니다. 로그인도 /api/auth 경로를 거쳐 처리하므로
        화면 코드에는 Supabase 공개 키나 원본 Data API 자격 증명이 없습니다.
      </section>

      <section class="panel" id="workspace" hidden>
        <form id="create-form" class="composer">
          <label>제목
            <input id="new-title" maxlength="120" required>
          </label>
          <label>본문
            <textarea id="new-body" maxlength="2000" required></textarea>
          </label>
          <button class="primary" type="submit">메모 추가</button>
        </form>
        <div id="workspace-status" class="status" aria-live="polite"></div>
        <div id="notes"></div>
      </section>
    </div>
  </main>

  <script>
    const signedOut = document.querySelector('#signed-out');
    const signedIn = document.querySelector('#signed-in');
    const workspace = document.querySelector('#workspace');
    const loginForm = document.querySelector('#login-form');
    const logoutButton = document.querySelector('#logout');
    const loginStatus = document.querySelector('#login-status');
    const workspaceStatus = document.querySelector('#workspace-status');
    const sessionLabel = document.querySelector('#session-label');
    const notesRoot = document.querySelector('#notes');
    const createForm = document.querySelector('#create-form');
    let session = null;

    const setStatus = (element, message = '', error = false) => {
      element.textContent = message;
      element.classList.toggle('error', error);
    };

    const parseJson = async (response) => {
      try { return await response.json(); } catch { return null; }
    };

    const applySession = (data) => {
      if (!data?.accessToken) {
        session = null;
        return false;
      }
      session = {
        access_token: data.accessToken,
        expires_at: data.expiresAt ?? null,
        user: data.user ?? null,
      };
      return true;
    };

    const authApi = async (action, body) => {
      const headers = { Accept: 'application/json' };
      const init = {
        method: 'POST',
        headers,
        credentials: 'same-origin',
        cache: 'no-store',
        redirect: 'error',
      };
      if (body) {
        headers['Content-Type'] = 'application/json';
        init.body = JSON.stringify(body);
      }
      return fetch(`/api/auth/${action}`, init);
    };

    const restoreSession = async () => {
      try {
        const response = await authApi('session');
        const data = await parseJson(response);
        if (!response.ok || !applySession(data)) {
          session = null;
          return false;
        }
        return true;
      } catch {
        session = null;
        return false;
      }
    };

    const apiError = async (response, fallback) => {
      const data = await parseJson(response);
      return typeof data?.error === 'string' ? data.error : fallback;
    };

    const authFetch = async (path, init = {}, retry = true) => {
      if (!session?.access_token && !(await restoreSession())) {
        throw new Error('로그인이 필요합니다.');
      }
      const headers = new Headers(init.headers || {});
      headers.set('Accept', 'application/json');
      headers.set('Authorization', `Bearer ${session.access_token}`);
      if (init.body) headers.set('Content-Type', 'application/json');
      const response = await fetch(path, {
        ...init,
        headers,
        cache: 'no-store',
        credentials: 'omit',
        redirect: 'error',
      });
      if (response.status === 401 && retry && await restoreSession()) {
        return authFetch(path, init, false);
      }
      return response;
    };

    const renderAuth = () => {
      const loggedIn = Boolean(session?.access_token);
      signedOut.hidden = loggedIn;
      signedIn.hidden = !loggedIn;
      workspace.hidden = !loggedIn;
      sessionLabel.textContent = loggedIn
        ? `로그인됨 · ${session.user?.email || 'Supabase 계정'}`
        : '로그아웃됨';
      if (!loggedIn) {
        notesRoot.replaceChildren();
        setStatus(workspaceStatus);
      }
    };

    const noteEditor = (note) => {
      const article = document.createElement('article');
      article.className = 'note';
      const grid = document.createElement('div');
      grid.className = 'note-grid';

      const titleLabel = document.createElement('label');
      titleLabel.textContent = '제목';
      const title = document.createElement('input');
      title.maxLength = 120;
      title.value = note.title;
      titleLabel.append(title);

      const bodyLabel = document.createElement('label');
      bodyLabel.textContent = '본문';
      const body = document.createElement('textarea');
      body.maxLength = 2000;
      body.value = note.body;
      bodyLabel.append(body);

      const actions = document.createElement('div');
      actions.className = 'note-actions';
      const save = document.createElement('button');
      save.type = 'button';
      save.className = 'secondary';
      save.textContent = '수정 저장';
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'danger';
      remove.textContent = '삭제';
      actions.append(save, remove);
      grid.append(titleLabel, bodyLabel, actions);
      article.append(grid);

      save.addEventListener('click', async () => {
        try {
          setStatus(workspaceStatus, '수정 중…');
          const response = await authFetch(`/api/notes/${encodeURIComponent(note.id)}`, {
            method: 'PUT',
            body: JSON.stringify({ title: title.value, body: body.value }),
          });
          if (!response.ok) {
            setStatus(workspaceStatus, await apiError(response, '수정에 실패했습니다.'), true);
            return;
          }
          setStatus(workspaceStatus, '수정했습니다.');
          await loadNotes();
        } catch (error) {
          setStatus(workspaceStatus, error.message, true);
        }
      });

      remove.addEventListener('click', async () => {
        if (!window.confirm('이 가상 메모를 삭제할까요?')) return;
        try {
          setStatus(workspaceStatus, '삭제 중…');
          const response = await authFetch(`/api/notes/${encodeURIComponent(note.id)}`, { method: 'DELETE' });
          if (!response.ok) {
            setStatus(workspaceStatus, await apiError(response, '삭제에 실패했습니다.'), true);
            return;
          }
          setStatus(workspaceStatus, '삭제했습니다.');
          await loadNotes();
        } catch (error) {
          setStatus(workspaceStatus, error.message, true);
        }
      });

      return article;
    };

    async function loadNotes() {
      if (!session?.access_token) return;
      try {
        const response = await authFetch('/api/notes');
        if (!response.ok) {
          setStatus(workspaceStatus, await apiError(response, '자료를 읽을 수 없습니다.'), true);
          notesRoot.replaceChildren();
          return;
        }
        const notes = await response.json();
        if (!Array.isArray(notes)) {
          setStatus(workspaceStatus, '자료 형식이 맞지 않습니다.', true);
          return;
        }
        notesRoot.replaceChildren(...notes.map(noteEditor));
        if (!notes.length) setStatus(workspaceStatus, '메모가 없습니다.');
      } catch (error) {
        setStatus(workspaceStatus, error.message, true);
        session = null;
        renderAuth();
      }
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      setStatus(loginStatus, '로그인 중…');
      try {
        const response = await authApi('login', {
          email: document.querySelector('#email').value,
          password: document.querySelector('#password').value,
        });
        const data = await parseJson(response);
        document.querySelector('#password').value = '';
        if (!response.ok || !applySession(data)) {
          setStatus(loginStatus, data?.error || '로그인에 실패했습니다.', true);
          return;
        }
        setStatus(loginStatus);
        renderAuth();
        await loadNotes();
      } catch {
        setStatus(loginStatus, '로그인 서버에 연결할 수 없습니다.', true);
      }
    });

    logoutButton.addEventListener('click', async () => {
      try { await authApi('logout'); } catch {}
      session = null;
      renderAuth();
    });

    createForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const title = document.querySelector('#new-title');
      const body = document.querySelector('#new-body');
      try {
        setStatus(workspaceStatus, '추가 중…');
        const response = await authFetch('/api/notes', {
          method: 'POST',
          body: JSON.stringify({ title: title.value, body: body.value }),
        });
        if (!response.ok) {
          setStatus(workspaceStatus, await apiError(response, '추가에 실패했습니다.'), true);
          return;
        }
        title.value = '';
        body.value = '';
        setStatus(workspaceStatus, '추가했습니다.');
        await loadNotes();
      } catch (error) {
        setStatus(workspaceStatus, error.message, true);
      }
    });

    (async () => {
      await restoreSession();
      renderAuth();
      if (session) await loadNotes();
    })();
  </script>
</body>
</html>
